"$schema" = 'https://starship.rs/config-schema.json'

# Blank line before each prompt for breathing room between commands.
add_newline  = true
scan_timeout = 3000

format = """
$os$username$hostname$directory$git_branch$git_commit$git_status$rust$golang$python$nodejs$cmd_duration
$character"""

# =============================================================================
# SYSTEM
# =============================================================================

[os]
disabled = false
format   = "[$symbol](bold blue) "

[os.symbols]
Arch    = "󰣇"
CachyOS = "󰣇"
Fedora  = ""
Ubuntu  = "󰕈"
Macos   = ""

[username]
style_user  = "bold yellow"
style_root  = "bold red"
format      = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format   = "[@$hostname](bold yellow) "

# =============================================================================
# DIRECTORY
# =============================================================================

[directory]
format            = "[$path](cyan)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo  = true

# =============================================================================
# VCS — native git integration
# =============================================================================

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)](bold purple) "

[git_commit]
format             = "[\\($hash\\)](green) "
commit_hash_length = 7
only_detached      = false

[git_status]
format = "([$all_status$ahead_behind]($style) )"

# =============================================================================
# LANGUAGES
# =============================================================================

[rust]
symbol = " "
format = "[$symbol$version](red) "

[golang]
symbol = " "
format = "[$symbol$version](cyan) "

[python]
symbol = " "
format = "[$symbol$version( \\($virtualenv\\))](yellow) "

[nodejs]
symbol = " "
format = "[$symbol$version](green) "

# =============================================================================
# PROMPT CHARACTER & EXTRAS
# =============================================================================

[cmd_duration]
min_time = 2000
format   = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold blue)"
