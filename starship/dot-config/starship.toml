"$schema" = 'https://starship.rs/config-schema.json'

# Blank line before each prompt for breathing room between commands.
add_newline = true

format = """
$os$username$hostname$directory$git_branch$git_status$jj$rust$golang$python$nodejs$cmd_duration
$character"""

# =============================================================================
# SYSTEM
# =============================================================================

[os]
disabled = false
format   = "[$symbol](bold blue) "

[os.symbols]
Arch    = "󰣇"
CachyOS = "󰣇"
Fedora  = ""
Ubuntu  = "󰕈"
Macos   = ""

[username]
style_user  = "bold yellow"
style_root  = "bold red"
format      = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
format   = "[@$hostname](bold yellow) "

# =============================================================================
# DIRECTORY
# =============================================================================

[directory]
format            = "[$path](cyan)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo  = true

# =============================================================================
# GIT
# =============================================================================

[git_branch]
symbol = " "
format = "on [$symbol$branch](bold purple) "

[git_status]
format     = "($ahead_behind$staged$modified$untracked$deleted$stashed$conflicted)"
ahead      = "[⇡$count](bold cyan)"
behind     = "[⇣$count](bold cyan)"
diverged   = "[⇡$ahead_count⇣$behind_count](bold cyan)"
staged     = "[+$count](bold green)"
modified   = "[●$count](bold yellow)"
untracked  = "[?$count](bold white)"
deleted    = "[✘$count](bold red)"
stashed    = "[≡](bold blue)"
conflicted = "[⚡$count](bold red)"

# =============================================================================
# JJ
# =============================================================================

[jj]
symbol = " "
format = "via [$symbol$bookmarks$working_copy]($style) "

# =============================================================================
# LANGUAGES
# =============================================================================

[rust]
symbol = " "
format = "[$symbol$version](red) "

[golang]
symbol = " "
format = "[$symbol$version](cyan) "

[python]
symbol = " "
format = "[$symbol$version( \\($virtualenv\\))](yellow) "

[nodejs]
symbol = " "
format = "[$symbol$version](green) "

# =============================================================================
# PROMPT CHARACTER & EXTRAS
# =============================================================================

[cmd_duration]
min_time = 2000
format   = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold blue)"
