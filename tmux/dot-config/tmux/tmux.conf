# =============================================================================
# tmux.conf — Catppuccin Mocha · Neovim-centric workflow
# Docs: https://man.openbsd.org/tmux
# =============================================================================

# =============================================================================
# PREFIX
# =============================================================================

# Unbind the default prefix (Ctrl-b) before reassigning it.
# https://man.openbsd.org/tmux#unbind-key
unbind C-b

# Set Ctrl-a as the new prefix. Easier to reach and familiar from GNU screen.
# https://man.openbsd.org/tmux#set-option — option: prefix
set -g prefix C-a

# Pressing the prefix twice sends a literal Ctrl-a to the running program
# (e.g. jump to start of line in bash/zsh with readline bindings).
# https://man.openbsd.org/tmux#send-prefix
bind C-a send-prefix

# =============================================================================
# GENERAL SETTINGS
# =============================================================================

# Start window indices at 1. Index 0 sits at the far end of the keyboard.
# https://man.openbsd.org/tmux#base-index
set -g base-index 1

# Start pane indices at 1 to match window numbering for consistency.
# https://man.openbsd.org/tmux#pane-base-index
setw -g pane-base-index 1

# Automatically renumber windows when one is closed so there are no gaps.
# e.g. closing window 2 of [1,2,3] produces [1,2] not [1,3].
# https://man.openbsd.org/tmux#renumber-windows
set -g renumber-windows on

# Keep 10 000 lines of scrollback per pane (default is 2 000).
# https://man.openbsd.org/tmux#history-limit
set -g history-limit 10000

# Zero out the escape key delay. Without this, pressing Escape in Neovim insert
# mode has a noticeable lag because tmux waits to see if it begins an escape
# sequence (like an arrow key).
# https://man.openbsd.org/tmux#escape-time
set -sg escape-time 0

# How long (ms) a binding marked with -r remains repeatable after the last
# key press. Lets you tap resize / window-switch keys multiple times in a row
# after a single prefix press.
# https://man.openbsd.org/tmux#repeat-time
set -g repeat-time 600

# Forward focus events (FocusIn/FocusOut) into panes. Required by Neovim for
# autoread (auto-reload files changed on disk) and plugins like gitsigns.nvim.
# https://man.openbsd.org/tmux#focus-events
set -g focus-events on

# Enable mouse: click to focus panes/windows, drag borders to resize, scroll
# to move through scrollback history.
# https://man.openbsd.org/tmux#mouse
set -g mouse on

# Use the shell defined in $SHELL for new panes/windows so that .zshrc /
# .bashrc is sourced correctly and aliases are available.
# https://man.openbsd.org/tmux#default-command
set -g default-command "${SHELL}"

# =============================================================================
# TERMINAL & TRUE COLOR
# =============================================================================

# Advertise tmux-256color inside panes. This terminfo entry (ncurses 6.1+)
# supports features that screen-256color lacks, such as strikethrough.
# https://man.openbsd.org/tmux#default-terminal
set -g default-terminal "tmux-256color"

# Pass 24-bit RGB color escape sequences through to the outer terminal.
# The glob "*" matches any $TERM value the outer terminal reports.
# Required for Neovim / Catppuccin to render full true color.
# https://man.openbsd.org/tmux#terminal-overrides
set -ga terminal-overrides ",*:RGB"

# Fallback: also enable the Tc (truecolor) capability flag for terminals
# that advertise true color via Tc rather than RGB.
# https://man.openbsd.org/tmux#terminal-overrides
set -ga terminal-overrides ",*:Tc"

# Enable the extended keys protocol so that combos like Ctrl-/ and Shift-Enter
# are passed through to Neovim rather than being swallowed by tmux.
# https://man.openbsd.org/tmux#extended-keys
set -g extended-keys on

# Integrate with the terminal's OSC 52 clipboard. Allows tmux copy operations
# to reach the system clipboard directly without an external helper.
# https://man.openbsd.org/tmux#set-clipboard
set -g set-clipboard on

# =============================================================================
# KEY BINDINGS — GENERAL
# =============================================================================

# Reload this config in-place without restarting tmux. Confirmation shown
# in the message bar at the bottom.
# https://man.openbsd.org/tmux#source-file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# =============================================================================
# KEY BINDINGS — SPLITS
# =============================================================================

# Unbind the defaults so they don't conflict.
# https://man.openbsd.org/tmux#unbind-key
unbind '"'
unbind %

# prefix + | → vertical split (panes side-by-side).
# -h = horizontal division (creates a side-by-side layout).
# -c "#{pane_current_path}" opens the new pane in the same directory.
# https://man.openbsd.org/tmux#split-window
bind | split-window -h -c "#{pane_current_path}"

# prefix + - → horizontal split (panes stacked top/bottom).
# https://man.openbsd.org/tmux#split-window
bind - split-window -v -c "#{pane_current_path}"

# prefix + c → new window, also inherits the current directory.
# https://man.openbsd.org/tmux#new-window
bind c new-window -c "#{pane_current_path}"

# =============================================================================
# KEY BINDINGS — PANE NAVIGATION (vim-tmux-navigator)
# =============================================================================
# Ctrl-h/j/k/l moves between tmux panes OR Neovim splits depending on focus.
# The is_vim check inspects the process running in the active pane: if it
# matches vim/nvim/fzf, the key is forwarded to it; otherwise tmux handles
# it as a pane-select command.
#
# To complete the Neovim side, add one of these to your Neovim config:
#   Lazy: { "christoomey/vim-tmux-navigator" }
#   Lazy: { "numToStr/Navigator.nvim" }
#
# https://man.openbsd.org/tmux#if-shell
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

# -n means no prefix required — these keys fire directly on Ctrl-h/j/k/l.
# https://man.openbsd.org/tmux#bind-key
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind C-l send-keys C-l

# Mirror the navigation bindings inside copy mode so you can switch panes
# without having to exit copy mode first.
# https://man.openbsd.org/tmux#bind-key (-T flag selects a key table)
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# =============================================================================
# KEY BINDINGS — PANE RESIZING
# =============================================================================
# prefix + H/J/K/L resizes the active pane in 5-cell steps.
# -r makes the binding repeatable within the repeat-time window, so you can
# tap the direction key multiple times after a single prefix press.
# https://man.openbsd.org/tmux#resize-pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# KEY BINDINGS — WINDOWS
# =============================================================================
# prefix + h/l → previous/next window.
# Complements the pane navigation above and keeps hands on the same keys.
# https://man.openbsd.org/tmux#previous-window
# https://man.openbsd.org/tmux#next-window
bind -r h previous-window
bind -r l next-window

# prefix + </> → move current window one position left/right.
# Follows the window after swapping so focus stays on the moved window.
# https://man.openbsd.org/tmux#swap-window
bind -r < swap-window -t -1 \; previous-window
bind -r > swap-window -t +1 \; next-window

# =============================================================================
# COPY MODE (vi keys)
# =============================================================================

# Use vi-style key bindings in scroll/copy mode to match Neovim muscle memory.
# https://man.openbsd.org/tmux#mode-keys
setw -g mode-keys vi

# prefix + v → enter copy mode. Mnemonic: like Neovim's visual mode entry.
# https://man.openbsd.org/tmux#copy-mode
bind v copy-mode

# v → character-wise selection (like Neovim visual mode).
# V → line-wise selection.
# Ctrl-v → block / rectangle selection.
# https://man.openbsd.org/tmux#Tables_and_Key_Bindings
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# y → yank selection to the Wayland clipboard and exit copy mode.
# Requires wl-clipboard. Swap "wl-copy" for "xclip -in -selection clipboard"
# or "xsel --clipboard --input" on X11.
# https://man.openbsd.org/tmux#copy-pipe
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# After a mouse drag-select, yank to clipboard and exit copy mode.
# https://man.openbsd.org/tmux#copy-pipe
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

set-option -g status-position top 

set -ogq @catppuccin_flavor "mocha"
set -ogq @catppuccin_window_status_style "rounded"
set -ogq @catppuccin_window_text "#W"
set -ogq @catppuccin_window_current_text "#W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Override catppuccin's mode-style: surface_0 is too close to base; use blue instead
set -g mode-style "fg=#{@thm_base},bg=#{@thm_blue},bold"

#set -g status-left ""
#set -g status-right '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '
set -g status-right-length 100
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.config/tmux/plugins/tpm/tpm'
